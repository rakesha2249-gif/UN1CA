              iget-object v0, v0, Lcom/android/systemui/statusbar/phone/IndicatorGardenInputProperties;->displayCutout:Landroid/view/DisplayCutout;
              invoke-virtual {v0}, Ljava/lang/Object;->getClass()Ljava/lang/Class;
              invoke-virtual {v0}, Landroid/view/DisplayCutout;->getSafeInsetRight()I
              move-result v0
              goto :goto_0
              :cond_0
              move v0, v1
              :goto_0
              invoke-virtual {p0}, Lcom/android/systemui/statusbar/phone/IndicatorGardenAlgorithmLeftCutout;->calculateLeftPadding()I
              move-result v2
              sub-int/2addr v2, v1
              invoke-virtual {p0}, Lcom/android/systemui/statusbar/phone/IndicatorGardenAlgorithmLeftCutout;->calculateRightPadding()I
              move-result v1
              sub-int/2addr v1, v0
              invoke-virtual {p0, p1, v2, v1}, Lcom/android/systemui/statusbar/phone/IndicatorGardenAlgorithm;->getRightContainerMaxWidth(Lcom/android/systemui/statusbar/phone/IndicatorGarden;II)I
              move-result p0
              return p0
          .end method

          .method public final calculateRightPadding()I
              .locals 3
              iget-object v0, p0, Lcom/android/systemui/statusbar/phone/IndicatorGardenAlgorithmLeftCutout;->inputProperties:Lcom/android/systemui/statusbar/phone/IndicatorGardenInputProperties;
              const/4 v1, 0x0
              iget-object v2, v0, Lcom/android/systemui/statusbar/phone/IndicatorGardenInputProperties;->displayCutout:Landroid/view/DisplayCutout;
              if-eqz v2, :cond_0
              iget-object v0, v0, Lcom/android/systemui/statusbar/phone/IndicatorGardenInputProperties;->displayCutout:Landroid/view/DisplayCutout;
              invoke-virtual {v0}, Ljava/lang/Object;->getClass()Ljava/lang/Class;
              invoke-virtual {v0}, Landroid/view/DisplayCutout;->getSafeInsetRight()I
              move-result v0
              goto :goto_0
              :cond_0
              const/4 v0, 0x0
              :goto_0
              invoke-virtual {p0, v1, v0}, Lcom/android/systemui/statusbar/phone/IndicatorGardenAlgorithm;->getSideCutoutPadding(II)I
