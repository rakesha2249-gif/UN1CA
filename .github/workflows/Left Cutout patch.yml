              iget-object v0, v0, Lcom/android/systemui/statusbar/phone/IndicatorGardenInputProperties;->displayCutout:Landroid/view/DisplayCutout;
              const/4 v1, 0x0
              if-eqz v0, :cond_0
              iget-object v0, p0, Lcom/android/systemui/statusbar/phone/IndicatorGardenAlgorithmLeftCutout;->inputProperties:Lcom/android/systemui/statusbar/phone/IndicatorGardenInputProperties;
