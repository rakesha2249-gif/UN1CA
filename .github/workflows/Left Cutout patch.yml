          with open(os.path.join(smali_dir, "IndicatorGardenAlgorithmLeftCutout.smali"), "w", encoding="utf-8") as f:
              f.write(cutout_code)
          print("IndicatorGardenAlgorithmLeftCutout.smali created successfully!")
          '

      - name: Fix Manifest Attribute Error
        run: |
          python3 -c '
          import glob, re
          for filepath in glob.glob("decompiled_ui/**/AndroidManifest.xml", recursive=True):
              with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()
              content = re.sub(r"\s*android:featureFlag=\"[^\"]*\"", "", content)
              with open(filepath, "w", encoding="utf-8") as f:
                  f.write(content)
          print("Manifest cleaned successfully!")
          '
          [ -f media_projection_app_selector.xml.bak ] && cp media_projection_app_selector.xml.bak decompiled_ui/res/layout/media_projection_app_selector.xml || true
          [ -f shutdown_dialog_finder.xml.bak ] && cp shutdown_dialog_finder.xml.bak decompiled_ui/res/layout/shutdown_dialog_finder.xml || true

      - name: Recompile and Sign SystemUI.apk
        run: |
          apktool b decompiled_ui -o patched_SystemUI.apk --use-aapt2 || apktool b decompiled_ui -o patched_SystemUI.apk
          
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O signer.jar
          java -jar signer.jar -apks patched_SystemUI.apk --allowResign

      - name: Upload Patched SystemUI
        uses: actions/upload-artifact@v4
        with:
          name: Patched-SystemUI-A21s
          path: patched_SystemUI.apk
          
